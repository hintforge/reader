<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#0d1119;--panel:#151b27;--line:#2a3447;--txt:#e6eaf2;--dim:#98a3b8;--ok:#5ae678}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f3f5f9;--panel:#fff;--line:#cfd6e3;--txt:#161c28;--dim:#586277;--ok:#1f9a43}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header,.bar{flex:none}
header{padding:10px 16px;border-bottom:1px solid var(--line)}h1{margin:0 0 3px;font-size:19px}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);align-items:center}
.chip,.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--txt);cursor:pointer;user-select:none;font:inherit;font-size:13px}
.btn{border-radius:8px;font-weight:600}.btn.on{background:#2e4a7a;border-color:#4a6fb0;color:#fff}
.chip.off{opacity:.38}.dot{width:14px;height:14px;border-radius:50%;display:inline-block;color:#0a0e16;font:700 9px/14px system-ui;text-align:center}
input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--txt);min-width:150px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
main{display:grid;grid-template-columns:minmax(0,1fr) __SIDEW__px;grid-template-rows:minmax(0,1fr);flex:1 1 auto;min-height:0}
#mapwrap{position:relative;overflow:hidden;min-height:0;border-right:1px solid var(--line);background:__MAPBG__}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}svg:active{cursor:grabbing}
aside{padding:12px 14px;overflow-y:auto;min-height:0;background:var(--panel);overscroll-behavior:contain}
.row{padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.row:hover{background:rgba(120,140,180,.14)}
.grp{margin:12px 0 2px;font-weight:700;font-size:13px}.grp .small{font-weight:400}.grp button{font:inherit;font-size:12px;color:#6ea8ff;background:none;border:0;cursor:pointer;padding:0}
.code{font-weight:700;display:inline-block;min-width:__CODEW__px}.tk{margin:0 7px 0 0;vertical-align:-2px;cursor:pointer;width:15px;height:15px}#markbtn{margin-top:8px}#detail details{margin-top:6px}#detail summary{cursor:pointer;color:var(--dim);font-size:13px}#detail a{color:#6ea8ff}.ok{color:var(--ok)}
#detail{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px;height:240px;overflow-y:auto;overscroll-behavior:contain}
.small{color:var(--dim);font-size:12px}.nopos{color:var(--dim);font-size:11px;font-style:italic}
@media (max-width:820px){body{height:auto;overflow:auto;display:block}main{display:block}#mapwrap{height:68vh}aside{overflow:visible}}
</style></head><body>
<header><h1>__TITLE__</h1>
<div class="sub">__SUBTITLE__</div>
<div class="sub"><b id="sync">__NTAKEN__ taken (as of __ASOF__)</b></div></header>
<div class="bar" id="bar"></div>
<div class="bar" id="bar2"></div>
<main><div id="mapwrap"><svg id="svg"></svg></div>
<aside><div id="detail"><span class="small">Click an item on the map or in the list.</span></div>
<div class="small" id="count"></div><div id="list"></div>
<p class="small">__CREDIT__</p></aside></main>
<script>
// Built by the hintforge reader's collectible-map tool (build_map.py) from the guide's collectible_map.json.
const CATS=__CATS__;
const ITEMS=__ITEMS__;
const LAND=__LAND__, LKIND=__LKIND__;
const GRID=__GRID__, IMG="__IMG__", IMGSIZE=__IMGSIZE__, VIEWS=__VIEWS__, START=__START__, ZOOM=__ZOOM__;
const OPT=__OPT__;
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("svg");
const colorOf={},shapeOf={}; CATS.forEach(c=>{colorOf[c.cat]=c.color;shapeOf[c.cat]=c.shape});
const on={}; CATS.forEach(c=>on[c.cat]=true); let hideTaken=false, onlyTaken=false, labels=true, q="", sel=null;
const lon={}; Object.keys(LKIND).forEach(k=>lon[k]=true); let placeNames=true;
const shownGroups={};
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
const img=el("image",{href:IMG,x:0,y:0,width:IMGSIZE[0],height:IMGSIZE[1]});
const gridg=el("g",{}), itemg=el("g",{}), landg=el("g",{});
let vb={x:0,y:0,w:IMGSIZE[0],h:IMGSIZE[1]};
function fit(b){const r=svg.getBoundingClientRect(),a=r.width/Math.max(r.height,1);let w=b[2],h=b[3];if(w/h<a)w=h*a;else h=w/a;vb={x:b[0]-(w-b[2])/2,y:b[1]-(h-b[3])/2,w,h};setvb()}
function setvb(){svg.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h);drawMap()}
function k(){return vb.w/Math.max(svg.clientWidth,1)}
function drawGrid(){gridg.innerHTML="";if(!GRID)return;const kk=k(),lw=1.6*kk;
 GRID.v.forEach(p=>el("line",{x1:p[0][0],y1:p[0][1],x2:p[1][0],y2:p[1][1],stroke:"#fff","stroke-opacity":.28,"stroke-width":lw},gridg));
 GRID.h.forEach(p=>el("line",{x1:p[0][0],y1:p[0][1],x2:p[1][0],y2:p[1][1],stroke:"#fff","stroke-opacity":.28,"stroke-width":lw},gridg));
 const fs=22*kk;GRID.labels.split("").forEach((L,c)=>{const t=el("text",{x:GRID.cols[c][0],y:GRID.cols[c][1]-14*kk,"text-anchor":"middle",fill:"#fff","font-size":fs,"font-weight":700,stroke:"#000","stroke-width":fs*.12,"paint-order":"stroke"},gridg);t.textContent=L});
 GRID.rows.forEach((p,r)=>{const t=el("text",{x:p[0]-16*kk,y:p[1]+fs*.35,"text-anchor":"middle",fill:"#fff","font-size":fs,"font-weight":700,stroke:"#000","stroke-width":fs*.12,"paint-order":"stroke"},gridg);t.textContent=r+1})}
function groupName(i){return i.group_hidden&&!shownGroups[i.group]?i.group:i.group_real}
function openWhere(i){return i.wt?"":i.where}
function visible(i){return on[i.cat]&&!(hideTaken&&i.taken)&&!(onlyTaken&&!i.taken)&&(!q||[i.code,i.cell,i.group&&groupName(i),openWhere(i),i.short,i.anchor,i.cat,i.cat_name].filter(Boolean).join(" ").toLowerCase().includes(q))}
function drawLand(){landg.innerHTML="";if(!LAND.length)return;const kk=k(),s=21*kk;
 LAND.forEach(p=>{if(!lon[p.kind])return;const K=LKIND[p.kind],gg=el("g",{style:"cursor:pointer"},landg);
  el("polygon",{points:(p.x)+","+(p.y-s)+" "+(p.x+s)+","+p.y+" "+p.x+","+(p.y+s)+" "+(p.x-s)+","+p.y,fill:K.fill,stroke:"#fff","stroke-width":2.2*kk},gg);
  const t=el("text",{x:p.x,y:p.y+4.6*kk,"text-anchor":"middle","font-size":15*kk,"font-weight":800,fill:K.txt,"pointer-events":"none"},gg);t.textContent=K.letter;
  if(placeNames){const nm=el("text",{x:p.x,y:p.y+s+14.5*kk,"text-anchor":"middle","font-size":13.5*kk,"font-weight":700,fill:"#fff",stroke:"#000","stroke-width":3.2*kk,"paint-order":"stroke","pointer-events":"none"},gg);nm.textContent=p.name}
  gg.__land=p})}
function pickLand(p){sel=null;const K=LKIND[p.kind];
 document.getElementById("detail").innerHTML='<b>'+esc(p.name)+'</b> &middot; '+esc(K.title)+(p.cell?'<br>Grid '+p.cell:'')+(p.detail?' &middot; '+esc(p.detail):'');drawMap()}
function draw(){drawMap();drawList()}
function drawMap(){drawGrid();drawLand();itemg.innerHTML="";const kk=k(),r=12*kk;
 ITEMS.forEach(i=>{if(i.x===null||!visible(i))return;let x=i.x,y=i.y;
  // An item that belongs to another (a chest inside a challenge area) sits on a small arc above it, one slot per kind.
  if(i.orbit!==undefined){const a=-Math.PI/2+i.orbit*0.75;x+=Math.cos(a)*r*2.3;y+=Math.sin(a)*r*2.3}
  const gg=el("g",{style:"cursor:pointer"},itemg);
  const sa={fill:colorOf[i.cat],stroke:i.taken?"#5ae678":(sel===i?"#fff":"#000a"),"stroke-width":(i.taken||sel===i?3.2:1.4)*kk};
  if(i.approx)sa["stroke-dasharray"]=(4*kk)+" "+(3*kk);
  const rr=r*(i.scale||1);
  if(shapeOf[i.cat]==="square")el("rect",Object.assign({x:x-rr*.92,y:y-rr*.92,width:rr*1.84,height:rr*1.84,rx:rr*.25},sa),gg);
  else el("circle",Object.assign({cx:x,cy:y,r:rr},sa),gg);
  if(labels){const t=el("text",{x:x,y:y+(i.code.length>3?3.6:3.8)*kk,"text-anchor":"middle","font-size":(i.code.length>3?8.5:10.5)*kk,"font-weight":700,fill:"#0a0e16","pointer-events":"none"},gg);t.textContent=i.code}
  if(i.taken){const bx=x+rr*.78,by=y-rr*.78;el("circle",{cx:bx,cy:by,r:rr*.55,fill:"#1f9a43",stroke:"#fff","stroke-width":1.2*kk,"pointer-events":"none"},gg);
   const c=el("text",{x:bx,y:by+rr*.24,"text-anchor":"middle","font-size":rr*.8,"font-weight":900,fill:"#fff","pointer-events":"none"},gg);c.textContent="✓"}
  gg.__item=i})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c])}
function rowText(i){if(i.short)return i.short;const w=openWhere(i);if(w)return OPT.rowmax&&w.length>OPT.rowmax?w.slice(0,OPT.rowmax-2)+"...":w;if(i.where)return "(location text folded: names "+i.why+")";return i.anchor||""}
// The list is rebuilt only on filter changes and marks, never on zoom or pan, and it keeps its scroll position.
function drawList(){const A=document.querySelector("aside"),keep=A.scrollTop,frag=document.createDocumentFragment();let n=0,last=null;
 ITEMS.forEach(i=>{if(!visible(i))return;n++;
  if(i.group!==undefined&&i.group!==last){last=i.group;const h=document.createElement("div");h.className="grp";
   const hasPos=ITEMS.some(j=>j.group===i.group&&j.x!==null),allPos=ITEMS.every(j=>j.group!==i.group||j.x!==null);
   h.innerHTML=esc(groupName(i))+(i.group_hidden&&!shownGroups[i.group]?' <button title="names a later story place">(show name)</button>':'')
    +' <span class="small">'+(allPos?'':(hasPos?'- some have no map position':'- no map position'))+'</span>';
   const b=h.querySelector("button");if(b)b.onclick=ev=>{ev.stopPropagation();shownGroups[i.group]=true;drawList();if(sel)pick(sel,false)};
   frag.appendChild(h)}
  const d=document.createElement("div");d.className="row";
  d.innerHTML='<input type="checkbox" class="tk" title="Taken"'+(i.taken?' checked':'')+'><span class="code">'+i.code+'</span> '+(i.cell?i.cell+' ':'')+esc(rowText(i))+(i.x===null?' <span class="nopos">no map position</span>':'')+(i.taken?' <span class="ok">taken</span>':"");
  d.firstChild.onclick=ev=>{ev.stopPropagation();toggle(i)};
  d.onclick=()=>pick(i,true);frag.appendChild(d)});
 document.getElementById("count").textContent=n+" items shown";
 document.getElementById("list").replaceChildren(frag);A.scrollTop=keep}
// Text above the player's spoiler settings is folded: shown only when clicked.
function gated(label,text,t,why){return t>0?'<details><summary>'+label+' (names '+(why||"an enemy")+' - click to show)</summary>'+esc(text)+'</details>':'<details'+(label==="Location"?' open':'')+'><summary>'+label+'</summary>'+esc(text)+'</details>'}
function pick(i,center){sel=i;
 const place=i.group===undefined?'':(i.group_hidden&&!shownGroups[i.group]?'<details style="display:inline"><summary style="display:inline">'+esc(i.group)+' (click to show the place name)</summary>'+esc(i.group_real)+'</details>':esc(i.group_real));
 const line2=[];if(i.cell)line2.push('Grid '+i.cell);if(i.anchor!==undefined)line2.push('near '+esc(i.anchor||"?"));if(place)line2.push(place);
 let loc;
 if(i.gw)loc=gated("Location",i.gw,i.gwt,i.gwhy);
 else if(OPT.detailWhere&&i.where)loc=gated(OPT.whereLabel[i.cat]||"Location",i.where,i.wt,i.why);
 else if(i.short)loc='<br>'+esc(i.short);
 else loc='<br><span class="small">'+(OPT.detailWhere?'(no location text)':'(the guide has no location text for this one)')+'</span>';
 document.getElementById("detail").innerHTML='<b>'+i.code+'</b> &middot; '+esc(i.title)+(i.name&&i.name!==i.title?' &middot; <b>'+esc(i.name)+'</b>':'')
  +'<br>'+line2.join(' &middot; ')+(i.taken?' &middot; <span class="ok">taken</span>':"")
  +(i.x===null?'<br><span class="small">No spot on this map'+(i.nopos?' ('+esc(i.nopos)+')':'')+'</span>':(i.approx?'<br><span class="small">Map spot is approximate</span>':''))
  +loc
  +(i.note?gated(OPT.noteLabel,i.note,i.nt):'')
  +(i.window?'<div class="small">When: '+esc(i.window)+'</div>':'')
  +(i.file?'<div class="small"><a href="'+i.file+'" target="_blank">Guide entry: '+esc(i.file.replace("../",""))+'</a></div>':'')
  +(OPT.sourceLink&&i.source_url&&i.source_url.startsWith("http")?'<div class="small"><a href="'+esc(i.source_url)+'" target="_blank" rel="noopener">'+esc(OPT.sourceLink)+'</a></div>':'')
  +'<button class="btn'+(i.taken?' on':'')+'" id="markbtn">'+(i.taken?'Taken - click to unmark':'Mark taken')+'</button>';
 document.getElementById("markbtn").onclick=()=>toggle(i);
 if(center&&i.x!==null){vb.x=i.x-vb.w/2;vb.y=i.y-vb.h/2;setvb()}else drawMap()}
const bar=document.getElementById("bar"),bar2=document.getElementById("bar2"),chips={};
CATS.forEach(c=>{const s=document.createElement("span");s.className="chip";s.innerHTML='<span class="dot" style="background:'+c.color+(c.shape==="square"?';border-radius:3px':'')+'">'+c.letter+'</span>'+esc(c.name.split(' (')[0]);
 s.onclick=()=>{on[c.cat]=!on[c.cat];s.classList.toggle("off",!on[c.cat]);draw()};chips[c.cat]=s;bar.appendChild(s)});
function setAll(v){CATS.forEach(c=>{on[c.cat]=v;chips[c.cat].classList.toggle("off",!v)});draw()}
function btn(txt,fn){const b=document.createElement("button");b.className="btn";b.textContent=txt;b.onclick=()=>{fn(b)};bar2.appendChild(b);return b}
btn("Show all",()=>{setAll(true);hideTaken=false;onlyTaken=false;bt.classList.remove("on");bo.classList.remove("on");draw()});
btn("Hide all",()=>setAll(false));
const bt=btn("Hide taken",b=>{hideTaken=!hideTaken;if(hideTaken){onlyTaken=false;bo.classList.remove("on")}b.classList.toggle("on",hideTaken);draw()});
const bo=btn("Only taken",b=>{onlyTaken=!onlyTaken;if(onlyTaken){hideTaken=false;bt.classList.remove("on")}b.classList.toggle("on",onlyTaken);draw()});
const sep=document.createElement("span");sep.className="sep";bar2.appendChild(sep);
btn("Codes on/off",b=>{labels=!labels;draw()});
Object.keys(LKIND).forEach(kd=>{const b=btn(LKIND[kd].label,b=>{lon[kd]=!lon[kd];b.classList.toggle("on",lon[kd]);draw()});b.classList.add("on")});
if(LAND.length)btn("Place names",b=>{placeNames=!placeNames;draw()});
VIEWS.forEach(v=>btn(v.label,()=>fit(v.box)));
btn("Clear selection",()=>{sel=null;document.getElementById("detail").innerHTML='<span class="small">Click an item on the map or in the list.</span>';draw()});
const se=document.createElement("input");se.type="search";se.placeholder="search code or text";se.oninput=()=>{q=se.value.trim().toLowerCase();draw()};bar2.appendChild(se);
let raf=0;function sched(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawMap()})}
// One wheel tick is a small zoom step around the pointer; the list is not touched.
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();
 const f=Math.exp(Math.max(-120,Math.min(120,e.deltaY*(e.deltaMode===1?16:1)))*0.0012);
 const nw=vb.w*f;if(nw<ZOOM[0]||nw>ZOOM[1])return;
 const mx=vb.x+(e.clientX-r.left)/r.width*vb.w,my=vb.y+(e.clientY-r.top)/r.height*vb.h;
 vb.w=nw;vb.h*=f;vb.x=mx-(e.clientX-r.left)/r.width*vb.w;vb.y=my-(e.clientY-r.top)/r.height*vb.h;
 svg.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h);sched()},{passive:false});
// Clicks on dots are read here, not from per-dot click listeners: pointer capture (needed for dragging) retargets the
// click to the svg, so a dot's own click handler never fires. The pressed element is remembered at pointerdown instead;
// a press that moved more than a few pixels is a pan, not a click. A click only selects; marking is in the side panel.
let drag=null,moved=false;svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,t:e.target};moved=false;svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{if(!drag)return;if(!moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;moved=true;const r=svg.getBoundingClientRect();vb.x=drag.vx-(e.clientX-drag.x)/r.width*vb.w;vb.y=drag.vy-(e.clientY-drag.y)/r.height*vb.h;svg.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h)});
svg.addEventListener("pointerup",()=>{if(drag&&moved)drawMap();else if(drag){let n=drag.t;while(n&&n!==svg&&!n.__item&&!n.__land)n=n.parentNode;
 if(n&&n.__item)pick(n.__item,false);else if(n&&n.__land)pickLand(n.__land)}drag=null});
let touched=false;svg.addEventListener("wheel",()=>touched=true);svg.addEventListener("pointerdown",()=>touched=true);window.addEventListener("resize",()=>{if(!touched)fit(START)});
// Marking. Each toggle is kept in browser storage at once (pending) and sent to the launcher's save helper, which writes
// the guide's item_status.json; a mark leaves pending only once the helper confirms it. pull() re-reads the file every
// 5 seconds and redraws only when a mark changed, so marks the reader writes into the file show up without a reload
// and without moving the map.
const BRIDGE="http://127.0.0.1:47831/taken",GUIDE=OPT.guide,ART=OPT.artifact,LKEY=OPT.storageKey;
let pending={},live=null;try{pending=JSON.parse(localStorage.getItem(LKEY)||"{}")||{}}catch(e){}
function savePending(){try{localStorage.setItem(LKEY,JSON.stringify(pending))}catch(e){}}
function syncText(){const n=ITEMS.filter(i=>i.taken).length,w=Object.keys(pending).length;
 document.getElementById("sync").textContent=n+" taken - "+(live===null?"checking the save helper...":live?(w?"saving...":"saved to the guide"):"kept in this window only: the launcher's save helper is not running"+(w?" ("+w+" to send)":""))}
function redraw(){draw();if(sel)pick(sel,false)}
function toggle(i){i.taken=!i.taken;pending[i.id]=i.taken;savePending();redraw();syncText();push(i.id)}
async function push(id){const v=pending[id];
 try{const r=await fetch(BRIDGE,{method:"POST",body:JSON.stringify({guide:GUIDE,artifact:ART,id:id,taken:v})}),j=await r.json();
  if(!j.ok)throw new Error(j.error);if(pending[id]===v){delete pending[id];savePending()}live=true}catch(e){live=false}syncText()}
async function pull(){
 try{const r=await fetch(BRIDGE+"?guide="+GUIDE+"&artifact="+ART,{cache:"no-store"}),j=await r.json();if(!j.ok)throw new Error(j.error);
  const s=new Set(j.taken);live=true;let ch=false;
  ITEMS.forEach(i=>{const v=(i.id in pending)?pending[i.id]:s.has(i.id);if(v!==i.taken){i.taken=v;ch=true}});
  Object.keys(pending).forEach(push);if(ch)redraw()}catch(e){live=false}syncText()}
ITEMS.forEach(i=>{if(i.id in pending)i.taken=pending[i.id]});
fit(START);drawList();syncText();pull();setInterval(pull,5000);
</script></body></html>
